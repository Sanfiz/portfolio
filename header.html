<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<nav class="sp-nav" id="sp-nav">
  <a class="sp-brand" href="index.html">Home</a>
  <div class="sp-links">
    <a href="index.html#about">About</a>
    <a href="index.html#cv">CV</a>
    <a href="index.html#milestones">Milestones</a>
    <a href="index.html#work">Visuals</a>
    <a href="index.html#climate">Art&History</a>
    <a href="index.html#contact">Contact</a>
  </div>
  <button class="sp-hamburger" id="sp-hamburger" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>
  <div class="sp-mobile-menu" id="sp-mobile-menu">
    <a href="index.html#about">About</a>
    <a href="index.html#cv">CV</a>
    <a href="index.html#work">Visuals</a>
    <a href="index.html#climate">Art&History</a>
    <a href="index.html#contact">Contact</a>
  </div>
</nav>

<style>
.sp-nav {
  position: fixed;
  top: 0;
  left: 0;
  bottom: 0;
  width: 160px;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  padding: 2.5rem 2rem;
  gap: 0;
  transition: background 0.3s ease;
background: transparent;
}

.sp-nav, .sp-nav * {
  pointer-events: auto !important;
  cursor: pointer;
}

.sp-links a {
  cursor: pointer;
  pointer-events: auto !important;
}

.sp-nav.scrolled {
  background: rgba(250, 250, 250, 0.75); 
  backdrop-filter: blur(12px);
}

.sp-brand {
  font-family: 'Playfair Display', serif;
  font-size: 1.1rem;
  font-weight: 700;
  color: #30384b !important;
  text-decoration: none;
  letter-spacing: 0.02em;
  margin-bottom: 2.5rem;
}

.sp-links {
  display: flex;
  flex-direction: column;
  gap: 0.2rem;
}

.sp-links a {
  font-family: 'DM Sans', sans-serif;
  font-size: 0.82rem;
  font-weight: 400;
  color: #30384b !important;
  text-decoration: none;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  opacity: 0.7;
  transition: opacity 0.2s;
  padding: 0.3rem 0;
}

.sp-links a:hover { opacity: 1; }

.sp-hamburger {
  display: none;
  flex-direction: column;
  gap: 5px;
  background: none;
  border: none;
  cursor: pointer;
  padding: 4px;
  position: fixed;
  top: 1rem;
  left: 1rem;
  z-index: 1100;
}

.sp-hamburger span {
  display: block;
  width: 22px;
  height: 1.5px;
  background: #30384b;
}

.sp-mobile-menu {
  display: none;
  flex-direction: column;
  position: fixed;
  top: 0; left: 0; right: 0;
  background: rgba(250, 250, 250, 0.92);
  padding: 4rem 2.5rem 1.5rem;
  gap: 1.2rem;
  z-index: 1050;
}

.sp-mobile-menu a {
  font-family: 'DM Sans', sans-serif;
  font-size: 0.9rem;
  color: #30384b !important;
  text-decoration: none;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.sp-mobile-menu.open { display: flex; }

@media (max-width: 768px) {
  .sp-nav { display: none; }
  .sp-hamburger { display: flex; }
}
</style>

<script>
window.addEventListener('scroll', () => {
  document.getElementById('sp-nav').classList.toggle('scrolled', window.scrollY > 40);
});

document.getElementById('sp-hamburger').addEventListener('click', () => {
  document.getElementById('sp-mobile-menu').classList.toggle('open');
});
</script>
